name: Changelog Automation

on:
  workflow_call:
    inputs:
      changelog-file:
        type: string
        default: CHANGELOG.md
      project:
        type: string
        default: ''
      version:
        description: Legacy explicit promotion is no longer supported; leave empty.
        type: string
        default: ''
      release-branch-prefix:
        type: string
        default: release/v
      runs-on:
        description: JSON labels for an authorized Linux runner with Docker, Bash and Git.
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      token:
        required: false
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, closed]
  push:
    branches: [main]

permissions: {}

jobs:
  compatibility:
    name: Validate caller options
    runs-on: ${{ fromJSON(inputs.runs-on || '["ubuntu-latest"]') }}
    steps:
      - name: Reject legacy explicit promotion
        env:
          LEGACY_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$LEGACY_VERSION" ]; then
            echo '::error::Explicit version promotion was replaced by the reviewed fragment-based version PR. Remove the legacy version input.'
            exit 1
          fi

  changelog:
    needs: compatibility
    permissions:
      contents: write
      pull-requests: write
      issues: read
      statuses: write
    # User-selected published 0.x channel; verified at v0.2.0 / 2d3f84fa9e5350f03636153fdb3ae2a822e5ae60.
    uses: php-fast-forward/changelog/.github/workflows/changelog.yml@v0
    with:
      runs-on: ${{ inputs.runs-on || '["ubuntu-latest"]' }}
      base-branch: main
      fragment-directory: .changelog
      changelog-file: ${{ inputs.changelog-file || 'CHANGELOG.md' }}
      locale: en
      tag-prefix: v
      source: tags
      resolve-pull-requests: true
      managed-branch: ${{ format('{0}next', inputs.release-branch-prefix || 'release/v') }}
      version-pr-title: 'Prepare release v{next_version}'
      automation-actor: github-actions[bot]
      comment-mode: always
      prepare-release: true
      publish: false
    secrets:
      token: ${{ secrets.token }}

  version_checks:
    name: Dispatch required version checks
    needs: changelog
    if: ${{ needs.changelog.outputs.version-pr != '' }}
    runs-on: ${{ fromJSON(inputs.runs-on || '["ubuntu-latest"]') }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@v8
        env:
          VERSION_PR: ${{ needs.changelog.outputs.version-pr }}
          VERSION_HEAD: ${{ needs.changelog.outputs.version-head }}
          MANAGED_BRANCH: ${{ format('{0}next', inputs.release-branch-prefix || 'release/v') }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.VERSION_PR)
            });
            if (pr.state !== 'open' || pr.head.repo?.full_name !== context.payload.repository.full_name ||
                pr.head.ref !== process.env.MANAGED_BRANCH || pr.head.sha !== process.env.VERSION_HEAD ||
                pr.user.login !== 'github-actions[bot]') {
              core.setFailed('Version PR identity or HEAD changed before required-check dispatch.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'tests.yml', ref: pr.head.ref,
              inputs: {'publish-required-statuses': 'true'}
            });

  project_prepared:
    name: Preserve release project transition
    needs: changelog
    if: ${{ needs.changelog.outputs.version-pr != '' }}
    runs-on: ${{ fromJSON(inputs.runs-on || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      repository-projects: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: php-fast-forward/dev-tools
          ref: ${{ github.repository == 'php-fast-forward/dev-tools' && github.sha || 'main' }}
          path: .dev-tools-actions
          persist-credentials: false
          sparse-checkout: .github/actions/project-board
      - uses: ./.dev-tools-actions/.github/actions/project-board/transition-status
        with:
          project: ${{ inputs.project || vars.PROJECT || '' }}
          from-status: Merged
          to-status: Release Prepared
